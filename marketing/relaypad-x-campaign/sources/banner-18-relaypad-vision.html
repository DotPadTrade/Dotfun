<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; overflow:hidden;
    background:linear-gradient(180deg,#08090c 0%,#0a1016 55%,#0c1420 100%);
    font-family:"Segoe UI",sans-serif; }
  .stars { position:absolute; inset:0;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 20%,rgba(255,255,255,.5),transparent),
      radial-gradient(1.2px 1.2px at 28% 8%,rgba(255,255,255,.35),transparent),
      radial-gradient(1.4px 1.4px at 47% 26%,rgba(255,255,255,.3),transparent),
      radial-gradient(1.2px 1.2px at 66% 12%,rgba(255,255,255,.45),transparent),
      radial-gradient(1.6px 1.6px at 82% 24%,rgba(255,255,255,.4),transparent),
      radial-gradient(1.2px 1.2px at 91% 44%,rgba(255,255,255,.3),transparent),
      radial-gradient(1.2px 1.2px at 8% 52%,rgba(255,255,255,.3),transparent),
      radial-gradient(1.4px 1.4px at 35% 44%,rgba(255,255,255,.25),transparent),
      radial-gradient(1.2px 1.2px at 58% 40%,rgba(255,255,255,.3),transparent); }
  /* horizon arc glow */
  .horizon { position:absolute; left:50%; top:1180px; transform:translateX(-50%);
    width:2200px; height:2200px; border-radius:50%;
    box-shadow:0 -4px 90px 10px rgba(46,178,70,.35), 0 -2px 220px 60px rgba(46,178,70,.12);
    background:#08090c; border-top:2px solid rgba(138,232,160,.8); }
  .kicker { position:absolute; left:0; right:0; top:120px; text-align:center; color:#55d26c;
    font-size:20px; font-weight:600; letter-spacing:.5em; }
  .mark { position:absolute; left:0; right:0; top:170px; text-align:center; }
  .mark img { height:96px; filter:drop-shadow(0 0 34px rgba(46,178,70,.35)); }
  .man1 { position:absolute; left:0; right:0; top:308px; text-align:center; color:#fff;
    font-size:64px; font-weight:300; letter-spacing:.01em; line-height:1.3; }
  .man1 b { font-weight:800; }
  .man2 { position:absolute; left:0; right:0; top:532px; text-align:center; color:#8ae8a0;
    font-size:44px; font-weight:800; letter-spacing:-0.01em; line-height:1.25; }
  .man3 { position:absolute; left:0; right:0; top:662px; text-align:center; color:#5c646f;
    font-size:24px; }
  .cta { position:absolute; left:0; right:0; top:742px; text-align:center; }
  .cta span { display:inline-flex; align-items:center; gap:12px; border:1px solid rgba(85,210,108,.55);
    border-radius:999px; padding:16px 36px; color:#8ae8a0; font-size:22px; font-weight:600;
    background:rgba(46,178,70,.08); }
  .brand { position:absolute; left:0; right:0; bottom:52px; text-align:center;
    display:flex; align-items:center; justify-content:center; gap:14px; }
  .brand img { height:40px; }
  .brand span { color:#fff; font-size:22px; font-weight:700; } .brand span i { color:#55d26c; font-style:normal; }
  .idx { position:absolute; right:60px; bottom:56px; color:#3e4650; font-family:Consolas,monospace;
    font-size:20px; letter-spacing:.2em; }
</style></head><body>
  <div class="stars"></div>
  <div class="kicker">THE RELAYPAD VISION</div>
  <div class="mark"><img src="../../../public/relaypad-logo-transparent.png" alt=""></div>
  <div class="man1">Launch infrastructure that respects<br><b>the chain — and the person using it.</b></div>
  <div class="man2">Built for two routes today.<br>Designed to keep evolving.</div>
  <div class="man3">Two routes · transparent treasury direction · a roadmap that ships before it speaks</div>
  <div class="cta"><span>Launch with RelayPad →</span></div>
  <div class="brand"><img src="../../../public/relaypad-logo-transparent.png" alt=""><span>Relay<i>Pad</i></span></div>
  <div class="idx">18 / 18</div>
</body></html>
