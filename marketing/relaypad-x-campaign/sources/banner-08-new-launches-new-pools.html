<!doctype html><html><head><meta charset="utf-8"><style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1600px; height:900px; overflow:hidden; background:#08090c;
    font-family:"Segoe UI",sans-serif; }
  .panel { position:absolute; top:0; bottom:0; width:730px; }
  .panel.l { left:0; background:linear-gradient(180deg,rgba(46,178,70,.10),rgba(8,9,12,0) 70%); }
  .panel.r { right:0; background:linear-gradient(180deg,rgba(28,126,214,.12),rgba(8,9,12,0) 70%); }
  .divider { position:absolute; left:799px; top:120px; bottom:120px; width:1px; background:#1e232b; }
  .neq { position:absolute; left:50%; top:96px; transform:translateX(-50%); width:120px; height:120px;
    border-radius:50%; background:#0c0e12; border:1px solid #1e232b; display:flex; align-items:center;
    justify-content:center; color:#fff; font-size:64px; font-weight:300; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  h1 { position:absolute; left:0; right:0; top:250px; text-align:center; color:#fff;
    font-size:72px; font-weight:800; letter-spacing:-0.02em; }
  h1 span { color:#5c646f; font-weight:400; }
  /* left motif: expanding launch rings around a mint dot */
  .ring { position:absolute; border:1.5px solid rgba(85,210,108,.5); border-radius:50%; }
  .core-dot { position:absolute; width:18px; height:18px; border-radius:50%; background:#2eb246;
    box-shadow:0 0 24px rgba(46,178,70,.9); }
  /* right motif: two overlapping liquidity pools */
  .pool { position:absolute; border-radius:50%; filter:blur(1px); }
  .cap { position:absolute; width:420px; text-align:center; }
  .cap .t { font-size:32px; font-weight:700; }
  .cap .d { margin-top:10px; color:#5c646f; font-size:20px; line-height:1.5; }
  .cap.l .t { color:#8ae8a0; } .cap.r .t { color:#a5d8ff; }
  .foot { position:absolute; left:50%; bottom:40px; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px; }
  .foot img { height:42px; }
  .foot span { color:#fff; font-size:23px; font-weight:700; } .foot span i { color:#55d26c; font-style:normal; }
</style></head><body>
  <div class="panel l"></div><div class="panel r"></div><div class="divider"></div>
  <div class="neq">≠</div>
  <h1>Not the same event. <span>Not the same tab.</span></h1>
  <!-- left: launch rings -->
  <div class="ring" style="left:290px;top:520px;width:220px;height:220px;opacity:.9"></div>
  <div class="ring" style="left:250px;top:480px;width:300px;height:300px;opacity:.55"></div>
  <div class="ring" style="left:210px;top:440px;width:380px;height:380px;opacity:.3"></div>
  <div class="ring" style="left:170px;top:400px;width:460px;height:460px;opacity:.16"></div>
  <div class="core-dot" style="left:391px;top:621px"></div>
  <div class="cap l" style="left:105px;top:690px">
    <div class="t">New Launches</div>
    <div class="d">Tokens freshly created — most still trading on their bonding curve.</div>
  </div>
  <!-- right: pools -->
  <div class="pool" style="left:1000px;top:500px;width:230px;height:230px;background:rgba(28,126,214,.35)"></div>
  <div class="pool" style="left:1090px;top:540px;width:210px;height:210px;background:rgba(116,192,252,.45)"></div>
  <div class="pool" style="left:1050px;top:590px;width:110px;height:110px;background:rgba(10,12,17,.9);
    border:2px solid rgba(165,216,255,.6);filter:none"></div>
  <div class="cap r" style="left:880px;top:690px">
    <div class="t">New Pools</div>
    <div class="d">Newly created liquidity pools — the post-graduation venues.</div>
  </div>
  <div class="foot"><img src="../../../public/relaypad-logo-transparent.png" alt=""><span>Relay<i>Pad</i></span></div>
</body></html>
